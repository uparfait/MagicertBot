<body>
<a class="skip_link" href="#main_content">Skip to main content</a>

<header class="wrap top">
  <a class="brand" href="/" aria-label="MagicertBot home">
    <img src="/images/icon.svg" alt="" width="36" height="36">
    <span>MagicertBot</span>
  </a>
</header>

<main class="wrap" id="main_content">
  <section class="intro">
    <h1>Free SSL certificates, made simple</h1>
    <p>Create, renew and check the certificates that keep your website on HTTPS.</p>
  </section>

  <noscript><p class="plain">This tool needs JavaScript turned on to talk to Let's Encrypt.</p></noscript>

  <nav class="tabs" role="tablist" aria-label="Choose what to do">
    <a class="tab" role="tab" id="tab_new" href="/" aria-controls="panel_new"
       aria-selected="{{new_selected}}" tabindex="{{new_tabindex}}" data-title="{{new_title}}">New <span class="long">certificate</span></a>
    <span class="tab_line" aria-hidden="true">Or</span>
    <a class="tab" role="tab" id="tab_renew" href="/renew" aria-controls="panel_renew"
       aria-selected="{{renew_selected}}" tabindex="{{renew_tabindex}}" data-title="{{renew_title}}">Renew <span class="long">certificate</span></a>
    <span class="tab_line" aria-hidden="true">Or</span>
    <a class="tab" role="tab" id="tab_check" href="/check" aria-controls="panel_check"
       aria-selected="{{check_selected}}" tabindex="{{check_tabindex}}" data-title="{{check_title}}">Check <span class="long">certificate</span></a>
  </nav>
