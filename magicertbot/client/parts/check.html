<section class="panel" id="panel_check" role="tabpanel" aria-labelledby="tab_check" {{check_hidden}}>
  <div data-view="upload">
    <div class="view_head">
      <span class="step_chip">Step 1 of 2</span>
      <h2>Check a certificate</h2>
      <p>Upload your certificate zip. We look at every file inside.</p>
    </div>
    <div data-drop="check"></div>

    <p class="or_line">or check a live website</p>

    <form id="site_form" novalidate>
      <div class="field">
        <label class="label" for="site_address">Website address <span class="required" aria-hidden="true">*</span></label>
        <div class="input"><i data-icon="globe"></i><input type="text" id="site_address" name="site_address" aria-required="true" placeholder="example.com" inputmode="url" autocomplete="url" spellcheck="false"></div>
        <span class="hint">We read the certificate it uses right now.</span>
        <span class="error" data-error="site_address"></span>
      </div>
      <div class="actions single" style="margin-top:6px">
        <button class="btn btn_outline" type="submit"><i data-icon="shield"></i>Check website</button>
      </div>
    </form>
  </div>

  <div data-view="work" hidden>
    <div class="view_head tight"><span class="step_chip">Step 2 of 2</span><h2>Checking your certificate</h2><p data-work_lead>We are reading each file in your zip.</p></div>
    <div class="loader" data-loader></div>
  </div>

  <div data-view="report" hidden>
    <button type="button" class="back" data-back="upload"><i data-icon="back"></i>Check another</button>
    <div data-report aria-live="polite"></div>
  </div>
</section>
